<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Analytics</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Custom CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>


<section class="hero">
  <h1>📊 Weather Analytics</h1>
  <p>Hourly trends • Daily insights</p>
  <button class="dark-toggle" onclick="toggleDark()">🌙</button>
</section>


<div class="container main">

  
  <h3 class="section-title">🌡️ Hourly Temperature</h3>
  <div class="chart-box">
    <canvas id="tempChart"></canvas>
  </div>

  
  <h3 class="section-title">💧 Humidity Variation</h3>
  <div class="chart-box">
    <canvas id="humidityChart"></canvas>
  </div>

  
  <h3 class="section-title">🌧️ Rainfall Forecast</h3>
  <div class="chart-box">
    <canvas id="rainChart"></canvas>
  </div>

  
  <h3 class="section-title">⏳ Next 24 Hours Temperature</h3>
  <div class="chart-box">
    <canvas id="next24Chart"></canvas>
  </div>

  
  <h3 class="section-title">📅 Daily Average Temperature (Next Days)</h3>
  <div class="chart-box">
    <canvas id="dailyChart"></canvas>
  </div>

</div>


<script>
const city = new URLSearchParams(window.location.search).get("city");

fetch(`/api/live-weather?city=${city}`)
  .then(res => res.json())
  .then(data => {

    if (data.error) {
      alert(data.error);
      return;
    }

    
    const timeLabels = data.forecast.map(x => x.time);
    const temps = data.forecast.map(x => x.temp);
    const humidity = data.forecast.map(x => x.humidity);
    const rain = data.forecast.map(x => x.rain);

    const animationConfig = {
      duration: 1500,
      easing: "easeInOutQuart"
    };

    
    new Chart(document.getElementById("tempChart"), {
      type: "line",
      data: {
        labels: timeLabels,
        datasets: [{
          label: "Temperature (°C)",
          data: temps,
          borderColor: "#ff6b6b",
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        animation: animationConfig,
        plugins: {
          title: {
            display: true,
            text: "Hourly Temperature Forecast"
          }
        },
        scales: {
          x: { title: { display: true, text: "Date / Time" }},
          y: { title: { display: true, text: "Temperature (°C)" }}
        }
      }
    });

    /* ---------- HUMIDITY CHART ---------- */
    new Chart(document.getElementById("humidityChart"), {
      type: "line",
      data: {
        labels: timeLabels,
        datasets: [{
          label: "Humidity (%)",
          data: humidity,
          borderColor: "#4dabf7",
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        animation: animationConfig,
        plugins: {
          title: {
            display: true,
            text: "Humidity Variation Over Time"
          }
        },
        scales: {
          x: { title: { display: true, text: "Date / Time" }},
          y: { title: { display: true, text: "Humidity (%)" }}
        }
      }
    });

    /* ---------- RAINFALL CHART ---------- */
    new Chart(document.getElementById("rainChart"), {
      type: "bar",
      data: {
        labels: timeLabels,
        datasets: [{
          label: "Rainfall (mm)",
          data: rain,
          backgroundColor: "#74c0fc"
        }]
      },
      options: {
        responsive: true,
        animation: animationConfig,
        plugins: {
          title: {
            display: true,
            text: "Rainfall Forecast"
          }
        },
        scales: {
          x: { title: { display: true, text: "Date / Time" }},
          y: { title: { display: true, text: "Rainfall (mm)" }}
        }
      }
    });

    /* ---------- NEXT 24 HOURS CHART ---------- */
    new Chart(document.getElementById("next24Chart"), {
      type: "line",
      data: {
        labels: data.next_24h.map(x => x.time),
        datasets: [{
          label: "Next 24 Hours Temperature (°C)",
          data: data.next_24h.map(x => x.temp),
          borderColor: "#f59f00",
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        animation: animationConfig,
        plugins: {
          title: {
            display: true,
            text: "Next 24 Hours Temperature Prediction"
          }
        },
        scales: {
          x: { title: { display: true, text: "Time (3-hour intervals)" }},
          y: { title: { display: true, text: "Temperature (°C)" }}
        }
      }
    });

    /* ---------- DAILY AVERAGE CHART ---------- */
    new Chart(document.getElementById("dailyChart"), {
      type: "bar",
      data: {
        labels: Object.keys(data.daily_avg),
        datasets: [{
          label: "Daily Average Temperature (°C)",
          data: Object.values(data.daily_avg),
          backgroundColor: "#51cf66"
        }]
      },
      options: {
        responsive: true,
        animation: animationConfig,
        plugins: {
          title: {
            display: true,
            text: "Daily Average Temperature (Upcoming Days)"
          }
        },
        scales: {
          x: { title: { display: true, text: "Date" }},
          y: { title: { display: true, text: "Temperature (°C)" }}
        }
      }
    });

  });

/* ---------- DARK MODE ---------- */
function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}
</script>

</body>
</html>
